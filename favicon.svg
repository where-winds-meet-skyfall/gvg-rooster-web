<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1430"/>
      <stop offset="100%" stop-color="#060818"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shield body -->
  <path d="M32 2 L61 13 L61 37 C61 53 47 62 32 64 C17 62 3 53 3 37 L3 13 Z" fill="url(#shieldBg)" stroke="#4a9eff" stroke-width="2.2"/>
  <!-- Inner border -->
  <path d="M32 8 L55 18 L55 37 C55 50 44 57 32 59.5 C20 57 9 50 9 37 L9 18 Z" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>
  <!-- Sword blade -->
  <line x1="32" y1="13" x2="32" y2="48" stroke="url(#bladeGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Crossguard -->
  <line x1="21" y1="27" x2="43" y2="27" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Handle -->
  <line x1="32" y1="48" x2="32" y2="55" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  <!-- Pommel -->
  <circle cx="32" cy="13" r="3.5" fill="#00D9FF" filter="url(#glow)"/>
  <!-- Center ambient glow -->
  <circle cx="32" cy="30" r="9" fill="#0080FF" opacity="0.12"/>
</svg>
