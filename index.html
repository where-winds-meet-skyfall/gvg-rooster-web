<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ростер GvG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">Ростер GvG</h1>
    <button id="legend-toggle" class="btn-legend" aria-expanded="false" aria-controls="legend">
      Легенда <span class="legend-arrow">▸</span>
    </button>
  </header>

  <div id="legend" class="legend hidden"></div>

  <div class="view-tabs" role="tablist" aria-label="Режим перегляду">
    <button class="tab active" data-view="list"    role="tab" aria-selected="true">Гравці</button>
    <button class="tab"        data-view="grouped" role="tab" aria-selected="false">По білдах</button>
    <button class="tab"        data-view="battle"  role="tab" aria-selected="false">Бойова пачка</button>
  </div>

  <details class="filters-panel">
    <summary class="filters-summary">Фільтри</summary>
    <div class="filters-body">

      <div class="filter-row">
        <input type="text" id="search" class="input-search"
               placeholder="Пошук за іменем…" autocomplete="off" spellcheck="false">
      </div>

      <div class="filter-row">
        <span class="filter-label">Основний білд:</span>
        <div id="build-filters" class="pill-group"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">Альт-білд:</span>
        <div id="alt-build-filters" class="pill-group"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">Пачка:</span>
        <div id="squad-filters" class="pill-group"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">Роль:</span>
        <div id="role-filters" class="pill-group"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">Спорядження:</span>
        <div id="gear-filters" class="pill-group"></div>
      </div>

      <div class="filter-row filter-row--inline filter-row--between">
        <label class="toggle-label">
          <input type="checkbox" id="ready-only" class="checkbox-ready">
          Тільки готові
        </label>
        <div class="sort-controls">
          <select id="sort-field" class="select-sort" aria-label="Сортування за полем">
            <option value="name">За іменем</option>
            <option value="gearLevel">За спорядженням</option>
            <option value="build">За білдом</option>
          </select>
          <button id="sort-dir" class="btn-sort-dir" title="Напрямок сортування">↑</button>
        </div>
      </div>

      <div class="filter-row filter-row--right">
        <button id="reset-filters" class="btn-reset">Скинути фільтри</button>
      </div>

    </div>
  </details>

  <div id="stats-bar" class="stats-bar hidden"></div>

  <main id="roster" class="roster"></main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
