<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ростер гильдии</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">Ростер гильдии</h1>
    <button id="legend-toggle" class="btn-legend" aria-expanded="true" aria-controls="legend">
      Легенда <span class="legend-arrow">▾</span>
    </button>
  </header>

  <div id="legend" class="legend"></div>

  <div class="view-tabs" role="tablist" aria-label="Режим просмотра">
    <button class="tab active" data-view="list"    role="tab" aria-selected="true">Все</button>
    <button class="tab"        data-view="grouped" role="tab" aria-selected="false">По билдам</button>
    <button class="tab"        data-view="ready"   role="tab" aria-selected="false">На бой</button>
  </div>

  <details class="filters-panel" open>
    <summary class="filters-summary">Фильтры</summary>
    <div class="filters-body">

      <div class="filter-row">
        <input type="text" id="search" class="input-search"
               placeholder="Поиск по имени…" autocomplete="off" spellcheck="false">
      </div>

      <div class="filter-row">
        <span class="filter-label">Основной билд:</span>
        <div id="build-filters" class="pill-group"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">Альт-билд:</span>
        <div id="alt-build-filters" class="pill-group"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">Пачка:</span>
        <div id="squad-filters" class="pill-group"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">Роль:</span>
        <div id="role-filters" class="pill-group"></div>
      </div>

      <div class="filter-row filter-row--inline">
        <span class="filter-label">Шмот:</span>
        <input type="number" id="gear-min" class="input-gear" placeholder="от" min="0">
        <span class="range-sep">—</span>
        <input type="number" id="gear-max" class="input-gear" placeholder="до" min="0">
      </div>

      <div class="filter-row filter-row--inline filter-row--between">
        <label class="toggle-label">
          <input type="checkbox" id="ready-only" class="checkbox-ready">
          Только готовые
        </label>
        <div class="sort-controls">
          <select id="sort-field" class="select-sort" aria-label="Сортировка по полю">
            <option value="name">По имени</option>
            <option value="gearLevel">По шмоту</option>
            <option value="build">По билду</option>
          </select>
          <button id="sort-dir" class="btn-sort-dir" title="Направление сортировки">↑</button>
        </div>
      </div>

      <div class="filter-row filter-row--right">
        <button id="reset-filters" class="btn-reset">Сбросить фильтры</button>
      </div>

    </div>
  </details>

  <div id="stats-bar" class="stats-bar hidden"></div>

  <main id="roster" class="roster"></main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
